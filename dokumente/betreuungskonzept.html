## 2. Adressatenkreis / Zielgruppe

Das Angebot richtet sich an im eigenen Haushalt lebende pflegebedürftige Menschen sowie deren pflegende Angehörige.

- **Pflegebedürftige der Pflegegrade 1 bis 5**, die den Entlastungsbetrag nach § 45b SGB XI (und ab PG 2 ggf. die Umwidmung nach § 45a Abs. 4 SGB XI) in Anspruch nehmen.
- Menschen mit **Unterstützungsbedarf im Alltag** (z. B. altersbedingte Einschränkungen, Vereinsamungsrisiko, eingeschränkte Alltagskompetenz, beginnende demenzielle Veränderungen).
- **Pflegende Angehörige**, die stunden- oder tageweise Entlastung benötigen.

Das Angebot ist ausdrücklich **niedrigschwellig** und ergänzt – ersetzt aber nicht – professionelle Pflege oder medizinische Versorgung.

## 3. Leistungsinhalte (P2 – Inhalt)

Vertraut erbringt **nicht-pflegerische** Betreuungs- und Entlastungsleistungen im häuslichen und wohnortnahen Umfeld. Die Leistungen gliedern sich in vier Bereiche:

| Leistungsbereich | Typische Inhalte |
|------------------|------------------|
| **Alltagsbegleitung** | Gesellschaft leisten, Gespräche, Vorlesen, Spiele, gemeinsame Tagesstruktur, Unterstützung bei leichten hauswirtschaftlichen Tätigkeiten im Rahmen der Begleitung |
| **Aktivierung** | Gedächtnis- und Bewegungsübungen im Alltag, Hobbys und Interessen aktiv halten, Motivation zu Teilhabe, Spaziergänge, kreative Beschäftigung |
| **Begleitung** | Begleitung zu Terminen, Einkäufen, Arztbesuchen, Behörden, Spaziergängen und sozialen/kulturellen Aktivitäten |
| **Entlastung** | Stunden- oder tageweise Übernahme der Beaufsichtigung/Anwesenheit zur Entlastung pflegender Angehöriger |

### 3.1 Klare Abgrenzung – was Vertraut ausdrücklich NICHT leistet

Zur fachlichen und haftungsrechtlichen Klarheit:

- **Keine** medizinische Behandlungspflege (z. B. Medikamentengabe, Wundversorgung, Injektionen).
- **Keine** körperbezogene Pflege / Grundpflege (z. B. Waschen, An-/Auskleiden, Toilettengang, Transfer).
- **Keine** medizinischen Diagnosen oder Therapieentscheidungen durch Betreuungskräfte.

> ⚠︎ **Grundsatz im gesamten Betrieb:** Bei erkennbarem pflegerischem oder medizinischem Bedarf erfolgt keine eigene Ausführung, sondern die Meldung an die verantwortliche Fachkraft und der Verweis an Pflegedienst, Hausarzt bzw. – im Notfall – den Rettungsdienst (siehe Krisenmanagement, Abschnitt 10).

## 4. Alleinstellungsmerkmal: Interessen-Matching

Vertraut vermittelt Betreuungspersonen nicht zufällig, sondern **nach Interessen, Werten und Hobbys** von Kundin/Kunde und Betreuungskraft (Interessen-Matching).

- Grundlage ist ein strukturiertes Interessenprofil, das im Erstgespräch erhoben und in der Plattform als Tags hinterlegt wird.
- Ziel: höhere Beziehungsqualität, mehr Kontinuität, geringere Wechselquote.
- Dieses systematische Matching ist in Köln bislang unbesetzt und stärkt Bindung und Zufriedenheit.

## 6. Personalschlüssel (P3)

### 6.1 Einzelbetreuung

- Der Regelfall ist die **Einzelbetreuung im Verhältnis 1:1** – eine Betreuungskraft betreut eine Kundin/einen Kunden.
- Damit ist eine durchgehende, persönliche und auf das Interessenprofil abgestimmte Betreuung sichergestellt.

### 6.2 Gruppenangebote (Ausbaustufe)

- Gruppenangebote sind zum Start **nicht** vorgesehen.
- Sofern sie später eingeführt werden, gilt ein am Betreuungs- und Aktivierungsbedarf orientierter Personalschlüssel von **[z. B. 1:5 bis 1:8]**, der vorab mit der Stadt Köln abgestimmt und im Konzept ergänzt wird.

## 7. Qualifikation des Personals (P4)

### 7.1 Start ausschließlich mit bereits qualifizierten Kräften

Zum Start setzt Vertraut **ausschließlich bereits qualifizierte Studierende/Werkstudierende** ein, die eine anerkannte Qualifikation **mitbringen**. Damit sind die Kräfte unmittelbar für § 45a-Einsätze einsetzbar; Vertraut muss anfangs nicht selbst schulen.

| Anerkannter Qualifikationsweg | Nachweis |
|-------------------------------|----------|
| Einschlägige Fachkraft (≥ 3-jährige Ausbildung/Studium im Pflege-, Sozial- oder Gesundheitsbereich) | Zeugnis/Urkunde |
| Betreuungskraft nach § 53c SGB XI (160 Stunden) | Zertifikat |
| Basisqualifizierung 40 UE (allgemeine Unterstützung/Betreuung) | Zertifikat |
| 30 UE (nur hauswirtschaftliche Unterstützung) | Zertifikat |

> ⚠︎ **Eigene Zertifizierung = Schritt 2:** Ein eigenes 40-UE-Qualifizierungscurriculum ist bewusst als spätere Ausbaustufe geplant (falls ohne Vorqualifikation rekrutiert wird) und nicht Voraussetzung des Starts.

### 7.2 Registrierung und Fristen

- **Registrierung jeder Kraft VOR dem ersten Einsatz** – ohne Registrierung keine Abrechnung.
- Der Qualifikationsnachweis liegt beim Start bereits vor; der spätere gesetzliche Rahmen (Abschluss ≤ 3 Monate nach Tätigkeitsbeginn) wird eingehalten oder unterschritten.

### 7.3 Führungszeugnis und Versicherung

- **Erweitertes Führungszeugnis** der Leitung (erweitert bei Nähe zu Minderjährigen) sowie Führungszeugnis-Vorlage der eingesetzten Kräfte gemäß Vorgabe.
- Ausreichender **Haftpflichtversicherungsschutz** (Betriebs-/Berufshaftpflicht) ist Anerkennungsvoraussetzung und besteht. ⚠︎ Policen und Deckungssummen extern bestätigen.

### 7.4 Werte und Haltung des Personals

Verbindliche Haltung im Einsatz: **professionell, respektvoll, zuverlässig, diskret, pünktlich, lösungsorientiert** – mit klarer Abgrenzung zu Pflege/Medizin, ohne private Geldgeschäfte, ohne Weitergabe von Kundendaten/Bildern und mit Meldung von Auffälligkeiten.

## 8. Sicherstellung der fachlichen Begleitung (P5)

Die durchgängige fachliche Begleitung wird durch die **verantwortliche Fachkraft [Name der Fachkraft]** sichergestellt.

- **Qualifikation:** ≥ 3-jährige staatlich anerkannte Berufsausbildung oder geeigneter Studienabschluss (z. B. Altenpflege, Gesundheits-/Kranken-/Kinderkrankenpflege, Heilerziehungspflege, Sozialarbeit/Sozialpädagogik, Psychologie, Therapie). ⚠︎ Konkreter Nachweis der Fachkraft dem Antrag beifügen.
- **Kernaufgaben:** fachliche Anleitung der Kräfte, regelmäßige Fallbesprechungen, **verbindliche Freigabe jeder Kraft vor dem ersten Einsatz (Gate)**, Qualitätssicherung, Bearbeitung von Auffälligkeiten und Beschwerden.
- **Einbindung im Mitarbeiterprozess:** Der 17-stufige Prozess (Bewerbung → … → **Freigabe Fachkraft (Gate)** → Matching → Einsatz → Doku → QS) verankert die Fachkraft als verbindliche Kontrollinstanz vor jedem Erst-Einsatz.
- Details in der „Kooperationsvereinbarung verantwortliche Fachkraft".

> ⚠︎ **Kritischer Punkt (häufigster Ablehnungsgrund):** Die fachliche Begleitung muss **ab dem ersten Betriebstag durchgängig** sichergestellt sein. Steht [Name der Fachkraft] operativ erst ab ~April 2027 zur Verfügung, ist für einen früheren Start eine **Übergangs-Kooperationsvereinbarung mit einer externen Fachkraft** (oder Regionalbüro) nachzuweisen. Ohne lückenlosen Fachkraftnachweis droht Ablehnung.

## 9. Vertretungsregelung bei Abwesenheit/Krankheit (P6)

Die Leistungserbringung ist auch bei Ausfall einer Betreuungskraft oder der Fachkraft sichergestellt.

- **Ausfall Betreuungskraft:** frühzeitige Information des Kunden, Vermittlung einer Vertretungs-/Springerkraft aus dem Team, möglichst unter Berücksichtigung des Interessenprofils; bei kurzfristigem Ausfall Klärung von Ersatztermin oder Vertretung innerhalb definierter Fristen.
- **Ausfall der verantwortlichen Fachkraft:** Sicherstellung über eine benannte Stellvertretung bzw. die Kooperationsfachkraft, sodass Erreichbarkeit und Freigaben nicht unterbrochen werden.

Das ausführliche Verfahren mit Fristen, Springer-Logik und Zuständigkeiten ist in der **„Vertretungs-, Beschwerde- & Krisenregelung"** geregelt.

## 10. Beschwerde- und Krisenmanagement (P7)

- **Beschwerdemanagement:** niedrigschwellige Eingangswege (Telefon, E-Mail, Formular), Eingangsbestätigung und Bearbeitung innerhalb definierter Fristen, klare Zuständigkeit bei der verantwortlichen Fachkraft/Leitung, Eskalationsstufen und vollständige Dokumentation.
- **Krisen- und Notfallmanagement:** definierte Abläufe bei Sturz, akuter gesundheitlicher Verschlechterung, Gefährdung sowie Nichterreichbarkeit – inkl. Sofortmaßnahmen, Meldeketten und klarer Regel, wann Rettungsdienst (112) und Angehörige einzubinden sind.

Das vollständige Verfahren ist in der **„Vertretungs-, Beschwerde- & Krisenregelung"** ausgearbeitet.

## 11. Dokumentation

Jeder Einsatz wird nachvollziehbar dokumentiert; die Plattform ist die **einzige** Dokumentationsquelle (kein WhatsApp).

**Pflichtfelder je Einsatz:** Datum · Start-/Endzeit · Ort · betreute Person · erbrachte Leistungen · Besonderheiten · ggf. Stimmung/Verfassung · Abweichungen · Rückmeldung an die Fachkraft bei Auffälligkeiten.

Harte Regeln: **keine Abrechnung ohne Leistungsnachweis**, keine unvollständigen Einträge, keine medizinischen Diagnosen durch Betreuungskräfte.

## 12. Qualitätssicherung

- **Laufend:** Freigabe-Gate der Fachkraft, digitale Doku mit Pflichtfeldern, Rückmeldeschleifen.
- **Monatlich:** Fall- und Teamgespräche, Auswertung der Kennzahlen.
- **Kennzahlen:** dokumentierte Einsätze (%), Beschwerde-, Wiederbuchungs-, Ausfall- und Wechselquote, Kunden- und Mitarbeiterzufriedenheit, Nachschulungen.
- **Jährlich:** Qualitäts- und Jahresbericht, Vorlage bei der Stadt Köln bis **31.03.** des Folgejahres (siehe eigene Berichtsvorlage).
