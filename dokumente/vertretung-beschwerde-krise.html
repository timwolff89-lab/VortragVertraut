## 1. Geltungsbereich, Rollen und Zuständigkeiten

Das Verfahren gilt für alle Einsätze, Betreuungskräfte, die verantwortliche Fachkraft und die Leitung.

| Rolle | Person | Kernverantwortung |
|-------|--------|-------------------|
| Betreuungskraft | jeweilige eingesetzte Kraft | Sofortmaßnahmen vor Ort, unverzügliche Meldung, Dokumentation |
| Verantwortliche Fachkraft | [Name der Fachkraft] | fachliche Entscheidungen, Freigaben, Beschwerde-/Krisenbearbeitung, Eskalation |
| Geschäftsführung / Einsatzleitung | Tim Wolff | organisatorische Steuerung, Vertretungsdisposition, externe Kommunikation |
| Vertretung/Springer | [benannte Springerkräfte] | kurzfristige Übernahme von Einsätzen |
| Rufbereitschaft (Einsatzzeiten) | [Name/Nummer] | zentrale Erreichbarkeit für Kräfte und Kunden |

**Zentrale Kontaktdaten (auszufüllen und allen Kräften/Kunden bekannt):**

- Zentrale / Rufbereitschaft: [Telefon]
- Verantwortliche Fachkraft: [Telefon]
- Einsatzleitung: [Telefon]
- Notruf Rettungsdienst/Feuerwehr: **112** · Polizei: **110**

## 2. Vertretungsregelung (P6)

Ziel: Kein Einsatz fällt ersatzlos und unkommuniziert aus; die Betreuung bleibt verlässlich.

### 2.1 Ausfall einer Betreuungskraft

| Fall | Frist / Reaktion | Vorgehen |
|------|------------------|----------|
| **Planbarer Ausfall** (Urlaub, bekannter Termin) | Meldung ≥ **[z. B. 7] Tage** vorher | Fachkraft/Leitung plant frühzeitig Vertretung nach Interessenprofil; Kunde wird informiert |
| **Kurzfristiger Ausfall** (Krankheit) | Meldung **unverzüglich**, spätestens [z. B. 12] Std. vor Einsatz | Springer-Aktivierung; Kunde erhält Ersatzkraft oder abgestimmten Ersatztermin |
| **Akutausfall** (am Einsatztag) | Reaktion innerhalb **[z. B. 60] Min.** nach Bekanntwerden | Rufbereitschaft informiert Kunde sofort, organisiert Springer oder verschiebt einvernehmlich |

**Springer-Logik:**

1. Prüfung, welche verfügbare Kraft dem Interessenprofil des Kunden am nächsten kommt.
2. Berücksichtigung von Nähe/Anfahrt und bestehender Kundenkenntnis.
3. Kurz-Briefing der Vertretungskraft (Bedarf, Besonderheiten, Doku-Stand) durch die Fachkraft/Leitung.
4. Information des Kunden über Name der Vertretung und Grund.
5. Dokumentation des Wechsels und Vermerk für die Wechselquote.

> ⚠︎ Springerpool und Reaktionsfristen an die reale Teamgröße (Startkohorte ~10 Kräfte) anpassen; Fristen mit Kunden im Vertrag transparent machen.

### 2.2 Ausfall der verantwortlichen Fachkraft

- Bei geplanter oder krankheitsbedingter Abwesenheit übernimmt eine **benannte Stellvertretung** bzw. die **externe Kooperationsfachkraft** die fachlichen Aufgaben (Erreichbarkeit, Freigaben, Krisenentscheidungen).
- Freigaben neuer Kräfte (Gate) und Krisenentscheidungen dürfen **nie unbesetzt** sein.

> ⚠︎ **Kritisch für die Anerkennung:** Die fachliche Begleitung muss durchgängig sichergestellt sein. Ist die verantwortliche Fachkraft operativ erst ab ~April 2027 verfügbar, ist für einen früheren Start eine externe Übergangs-Kooperation nachzuweisen (siehe „Kooperationsvereinbarung verantwortliche Fachkraft").

### 2.3 Eskalation bei Vertretung

| Stufe | Auslöser | Zuständig |
|-------|----------|-----------|
| 1 | Ausfall gemeldet | Rufbereitschaft/Einsatzleitung |
| 2 | Keine Vertretung innerhalb Frist gefunden | Verantwortliche Fachkraft |
| 3 | Wiederholte/strukturelle Ausfälle | Geschäftsführung (Kapazitäts-/Personalmaßnahme) |

## 3. Beschwerdemanagement (P7)

### 3.1 Grundsätze

Beschwerden sind willkommen und werden als Chance zur Qualitätsverbesserung behandelt – ernst nehmen, zeitnah, nachvollziehbar, ohne Nachteil für die beschwerdeführende Person.

### 3.2 Eingangswege

- Telefonisch über die Zentrale: [Telefon]
- Per E-Mail: [E-Mail]
- Über das Beschwerde-/Feedbackformular (Plattform/Papier)
- Mündlich gegenüber Betreuungskraft (leitet unverzüglich weiter)

### 3.3 Ablauf mit Fristen

| Schritt | Frist | Zuständig |
|---------|-------|-----------|
| Eingang erfassen & dokumentieren | sofort | Empfangende Stelle |
| Eingangsbestätigung an Beschwerdeführer | **≤ 2 Arbeitstage** | Fachkraft/Leitung |
| Sachverhalt prüfen (Kraft anhören, Doku sichten) | ≤ [z. B. 5] Arbeitstage | Verantwortliche Fachkraft |
| Lösung/Rückmeldung an Beschwerdeführer | **≤ 10 Arbeitstage** | Verantwortliche Fachkraft |
| Maßnahme umsetzen & Wirksamkeit prüfen | nach Vereinbarung | Fachkraft/Leitung |
| Abschluss dokumentieren | bei Abschluss | Fachkraft/Leitung |

### 3.4 Eskalationsstufen

| Stufe | Situation | Zuständig |
|-------|-----------|-----------|
| 1 | Einfache Beschwerde, direkt lösbar | Betreuungskraft/Leitung |
| 2 | Qualitäts-/Verhaltensmangel, Wiederholung | Verantwortliche Fachkraft |
| 3 | Schwerwiegend (Gefährdung, Vertrauensbruch, Rechtsverstoß) | Geschäftsführung; ggf. Meldung an Stadt Köln/Behörden |

### 3.5 Dokumentation

Jede Beschwerde wird mit Eingangsdatum, Sachverhalt, Beteiligten, Maßnahme, Frist und Abschluss erfasst. Die Beschwerdequote fließt in den Qualitäts- und Jahresbericht ein.

## 4. Krisen- und Notfallmanagement (P7)

### 4.1 Grundprinzip

**Leben und Gesundheit haben Vorrang vor allem anderen.** Im Zweifel immer zuerst **112** (Rettungsdienst) rufen. Betreuungskräfte stellen **keine medizinischen Diagnosen** und führen keine pflegerischen/medizinischen Maßnahmen aus, sondern sichern, alarmieren und dokumentieren.

### 4.2 Szenarien und Sofortmaßnahmen

| Szenario | Sofortmaßnahme vor Ort | Meldekette |
|----------|------------------------|------------|
| **Sturz** | Ruhe bewahren, Person nicht ruckartig bewegen; bei Verletzung/Bewusstlosigkeit/Unsicherheit **112**; Erste Hilfe im Rahmen der Möglichkeiten | 112 → Angehörige → Fachkraft → Leitung; Doku |
| **Akute gesundheitliche Verschlechterung** (z. B. Atemnot, Brustschmerz, Verwirrtheit) | **112** rufen, bei Person bleiben, Zustand beobachten | 112 → Angehörige → Fachkraft; Doku |
| **Selbst-/Fremdgefährdung** | Deeskalieren, eigene Sicherheit wahren; bei Gefahr **112/110** | 112/110 → Fachkraft → Leitung; Doku |
| **Kunde nicht erreichbar / öffnet nicht** (trotz vereinbartem Termin) | Klingeln/Anruf; Hinweise auf Notlage prüfen; Angehörige/Notfallkontakt anrufen | Bei begründetem Notfallverdacht **112** (ggf. Türöffnung); Fachkraft/Leitung informieren; Doku |
| **Betreuungskraft nicht erreichbar / erscheint nicht** | Rufbereitschaft kontaktiert Kraft; Kunde absichern | Springer aktivieren; Fachkraft/Leitung; Doku |
| **Anzeichen von Gewalt/Vernachlässigung/Missbrauch** | Wahrnehmung sichern, nicht konfrontieren | Unverzüglich Fachkraft → Leitung; ggf. Behörden nach Prüfung |

### 4.3 Meldekette (Alarmierungsreihenfolge)

1. **Akute Lebensgefahr:** zuerst **112** (bzw. **110**), dann Angehörige/Notfallkontakt.
2. **Verantwortliche Fachkraft** [Name der Fachkraft] informieren.
3. **Geschäftsführung/Einsatzleitung** (Tim Wolff) informieren.
4. **Dokumentation** unmittelbar im Anschluss.

### 4.4 Nachbereitung

- Vollständige Ereignisdokumentation (Was, Wann, Wer, Maßnahmen, Beteiligte).
- Fachliche Nachbesprechung mit der beteiligten Kraft, ggf. Nachschulung.
- Bei besonderen Vorkommnissen ⚠︎ Prüfung einer **Meldepflicht gegenüber der Stadt Köln** bzw. weiteren Stellen (mit Behörde/Rechtsberatung klären).
- Prüfung von Maßnahmen zur Wiederholungsvermeidung; Aufnahme in den Jahresbericht.
