## Grundregeln

- **Keine Abrechnung ohne vollständigen, beidseitig unterschriebenen Leistungsnachweis.**
- Das digitale System ist die **einzige** Dokumentationsquelle (kein WhatsApp, keine losen Zettel).
- **Keine medizinischen Diagnosen** und keine Einschätzungen zu Krankheitsbildern durch die Betreuungskraft.
- Dokumentation unmittelbar nach dem Einsatz, wahrheitsgemäß und vollständig.
