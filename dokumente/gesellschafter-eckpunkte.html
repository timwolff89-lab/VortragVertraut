<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gesellschafter-Eckpunkte (Term Sheet) · Vertraut</title><link rel="stylesheet" href="../assets/style.css"></head><body class="doc" data-prefix="../" data-slug="gesellschafter-eckpunkte" data-title="Gesellschafter-Eckpunkte (Term Sheet)" data-dept="gruendung" data-typ="Eckpunkte" data-prio="Priorität A" data-status="extern" data-teaser="Cap Table, Vesting, Wandeldarlehen: Grundlage für den Anwalt."><script id="md" type="text/markdown">Dieses Eckpunktepapier (Term Sheet) fasst die geplante Gesellschafter- und Beteiligungsstruktur der Vertraut UG (haftungsbeschränkt) zusammen. Es dient als Verhandlungs- und Besprechungsgrundlage für Gründer, Investor und den beauftragten Anwalt — es ist **keine** rechtsverbindliche Vereinbarung.

⚠︎ **Vor Unterzeichnung anwaltlich prüfen lassen.** Gesellschaftsvertrag, Vesting-/Leaver-Klauseln und der Darlehensvertrag müssen sauber ausgestaltet werden — gerade bei Beteiligung eines Familienmitglieds und eines Investors.

## 3. Investment & Finanzierung

- Angestrebtes Investment: **150.000–200.000 €**.
- Struktur: **15 % Eigenkapital** (entspricht bei fairer Frühphasenbewertung grob 45.000–60.000 €), **Überschuss als (Wandel-)Darlehen** an die UG. So bleibt die Kontrolle bei Tim und spätere Verwässerung durch eine Plattform-Runde wird abgefedert. ⚠︎ Bewertung & Wandlungskonditionen mit Anwalt/Steuerberater festlegen.
- Alternativ-Stellschraube: Braucht der Investor mehr Eigenkapital-%, geht das zulasten von Tim (z. B. 50 % / 20 %) — oder stärker über Darlehen strukturieren.

## 4. Governance & Kontrolle

- **Geschäftsführung:** Tim Wolff (CEO). Operative Leitung ab ~April 2027 durch [Schwester].
- Einfache Mehrheit (> 50 %) bei Tim → Tagesgeschäft handlungsfähig.
- **Sperrminorität beachten:** Satzungsänderungen und Kapitalerhöhungen erfordern 75 % → Tims 55 % sichern die einfache, nicht die qualifizierte Mehrheit.
- **Vesting & Leaver:** Alle operativen Anteile (Schwester, Team-Pool) mit Vesting und Good-/Bad-Leaver-Klauseln. Bei Familienbeteiligung besonders wichtig, schriftlich zu regeln.

## 5. Offene Punkte / nächste Schritte

1. Mit dem Investor **die eine Zahl** fixieren: Betrag, %-Eigenkapital, Split Eigenkapital/Darlehen.
2. Rolle, Vergütung und Vesting mit [Schwester] besprechen.
3. Anwalt: Gesellschaftsvertrag, Vesting/Leaver, Wandeldarlehen, VSOP-Bedingungen.
4. Steuerberater: steuerliche Behandlung Darlehen, Geschäftsführer-/Gründervergütung (erst bei tragfähigem Deckungsbeitrag).
