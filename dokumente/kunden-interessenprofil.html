<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kunden-Interessenprofil (Matching) · Vertraut</title><link rel="stylesheet" href="../assets/style.css"></head><body class="doc" data-prefix="../" data-slug="kunden-interessenprofil" data-title="Kunden-Interessenprofil (Matching)" data-dept="betrieb" data-typ="Formular" data-prio="Priorität B" data-status="entwurf" data-teaser="Die Datengrundlage für den USP Interessen-Matching."><script id="md" type="text/markdown">Dieser Bogen erfasst Interessen, Lebenswelt und Persönlichkeit der zu betreuenden Person und ist die Datengrundlage für das Interessen-Matching – den zentralen USP von „Vertraut".

## Zweck

Anders als bei zufälliger Zuteilung wird die Betreuungsperson nach **Interessen, Werten und Hobbys** ausgewählt. Je konkreter dieser Bogen ausgefüllt ist, desto besser die Passung. Die Angaben werden als **Tags** im System hinterlegt und mit den Profilen der Betreuungskräfte abgeglichen.

- Ausfüllen mit der Person selbst; Angehörige ergänzen.
- Freitext ist erwünscht – lieber zu viel als zu wenig.
- Sensible Angaben nur, soweit für das Matching hilfreich (Datensparsamkeit).
