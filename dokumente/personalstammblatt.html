<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Personalstammblatt (Onboarding) · Vertraut</title><link rel="stylesheet" href="../assets/style.css"></head><body class="doc" data-prefix="../" data-slug="personalstammblatt" data-title="Personalstammblatt (Onboarding)" data-dept="personal" data-typ="Formular" data-prio="Priorität B" data-status="entwurf" data-teaser="Erfasst beim Onboarding IBAN, Steuer-ID, SV-Nummer, Krankenkasse und Werkstudent/Minijob-Angaben."><script id="md" type="text/markdown">Dieses Personalstammblatt wird beim Onboarding — nach der Einstellungszusage — ausgefüllt. Es erfasst alle Daten, die das Lohnbüro für die korrekte An-/Abmeldung und Gehaltsabrechnung von Werkstudent:innen und Minijobber:innen benötigt (IBAN, Steuer-Identifikationsnummer, Sozialversicherungsnummer u. a.). In der Plattform wird daraus ein sicheres, verschlüsseltes Onboarding-Formular.

⚠︎ Pflichtfelder und genaue Meldeanforderungen mit dem Lohnbüro/Steuerberater abstimmen (Minijob-Zentrale, Krankenkasse, Rentenversicherung). Es handelt sich um besonders zu schützende personenbezogene Daten (DSGVO) — Zugriff nur für Lohn/HR.

## 7. Datenschutz & Bestätigung
Die vorstehenden Daten werden ausschließlich zur Begründung und Durchführung des Beschäftigungsverhältnisses (Lohnabrechnung, Meldungen an Sozialversicherung/Finanzamt) verarbeitet. Es gilt die Datenschutzerklärung; die Verschwiegenheits- und Datenschutzverpflichtung wurde gesondert unterzeichnet.

Ich bestätige die Richtigkeit der Angaben und verpflichte mich, Änderungen (Bankdaten, Krankenkasse, weitere Beschäftigungen, Studienstatus) unverzüglich mitzuteilen.
