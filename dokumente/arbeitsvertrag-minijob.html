<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Arbeitsvertrag Minijob (Entwurf) · Vertraut</title><link rel="stylesheet" href="../assets/style.css"></head><body class="doc" data-prefix="../" data-slug="arbeitsvertrag-minijob" data-title="Arbeitsvertrag Minijob (Entwurf)" data-dept="personal" data-typ="Vertrag" data-prio="Priorität B" data-status="extern" data-teaser="Minijob 2026 (603-Euro-Grenze): für ergänzende Kräfte."><script id="md" type="text/markdown">Dieser Vertragsentwurf regelt die geringfügig entlohnte Beschäftigung (Minijob) einer bereits qualifizierten Betreuungskraft im Betreuungsdienst „Vertraut" und folgt in Aufbau und Pflichten dem Werkstudentenvertrag.

> ⚠︎ **Wichtiger Hinweis:** Dieser Entwurf ersetzt keine Rechtsberatung. Vor erstmaliger Verwendung zwingend durch **Lohnbüro/Steuerberater** (Minijob-Meldung, Pauschalabgaben, Verdienstgrenze) und **Fachanwalt für Arbeitsrecht** prüfen und freigeben lassen. Alle mit ⚠︎ markierten Stellen sind besonders prüfbedürftig.

## Vertragsparteien

**Arbeitgeber:in**
[Firmierung, z. B. Vertraut UG (haftungsbeschränkt)]
[Straße, Hausnummer]
[PLZ, Köln]
vertreten durch die Geschäftsführung [Tim Wolff]
– nachfolgend „Arbeitgeber" –

und

**Arbeitnehmer:in**
[Vorname, Nachname]
[Straße, Hausnummer]
[PLZ, Ort]
geboren am [Geburtsdatum] in [Geburtsort]
– nachfolgend „Arbeitnehmer:in" –

schließen folgenden Arbeitsvertrag über eine geringfügig entlohnte Beschäftigung.

## § 1 Beginn des Arbeitsverhältnisses und Tätigkeit

1. Das Arbeitsverhältnis beginnt am **[Datum]** und wird auf [unbestimmte Zeit / befristet bis [Datum]] geschlossen. ⚠︎ *Bei Befristung gesonderte Prüfung nach TzBfG.*
2. Der/die Arbeitnehmer:in wird als **Betreuungskraft (Alltagsbegleitung)** im Rahmen einer geringfügigen Beschäftigung eingestellt.
3. Der Tätigkeitsinhalt umfasst insbesondere:
   - niedrigschwellige **Alltagsbegleitung, Aktivierung und Entlastung** im häuslichen Umfeld,
   - Begleitung bei Aktivitäten, Gesprächen, Spaziergängen, Terminen sowie unterstützende hauswirtschaftliche Tätigkeiten,
   - vollständige Leistungsdokumentation nach jedem Einsatz im internen System.
4. **Ausdrücklich nicht** geschuldet werden **medizinische oder körperbezogene Pflegeleistungen**. Die Tätigkeit ist strikt von pflegerischen und medizinischen Leistungen abzugrenzen.
5. Der Arbeitgeber ist berechtigt, im Rahmen des Direktionsrechts andere zumutbare, gleichwertige Tätigkeiten und Einsatzorte zuzuweisen.

## § 2 Einsatzort

1. Die Tätigkeit wird überwiegend **im häuslichen Umfeld der betreuten Personen im Raum Köln / NRW** ausgeübt; die Einsatzorte werden über die Einsatzplanung zugewiesen.
2. Ein fester Arbeitsplatz in den Räumen des Arbeitgebers wird nicht begründet.
3. Fahrtkosten/Fahrtzeiten: [Regelung ergänzen]. ⚠︎ *Behandlung mit Lohnbüro klären; Fahrtzeit kann Arbeitszeit und damit verdienstgrenzenrelevant sein.*

## § 3 Status als geringfügige Beschäftigung (Minijob 2026)

1. Es handelt sich um eine **geringfügig entlohnte Beschäftigung** im Sinne des § 8 Abs. 1 Nr. 1 SGB IV.
2. Der regelmäßige monatliche Verdienst darf die **Geringfügigkeitsgrenze von 603 € (Stand 2026)** im Durchschnitt **nicht überschreiten**; die Jahresverdienstgrenze beträgt entsprechend das Zwölffache (7.236 €).
3. Ein nur gelegentliches und nicht vorhersehbares Überschreiten der Grenze ist innerhalb der gesetzlich zulässigen Anzahl von Kalendermonaten pro Zeitjahr unschädlich. ⚠︎ *Aktuelle Regel zum zulässigen Überschreiten mit Lohnbüro/Minijob-Zentrale abstimmen.*
4. Der Arbeitgeber meldet die Beschäftigung bei der **Minijob-Zentrale (Deutsche Rentenversicherung Knappschaft-Bahn-See)** an und führt die pauschalen Arbeitgeberbeiträge und Umlagen ab. ⚠︎ *Anmeldung, Betriebsnummer und Pauschalabgaben (2026 ca. 31,17 % zzgl. Unfallversicherung) über das Lohnbüro.*
5. **Rentenversicherung:** Die Beschäftigung ist grundsätzlich rentenversicherungspflichtig mit geringem Eigenanteil. Der/die Arbeitnehmer:in kann sich auf schriftlichen Antrag von der Rentenversicherungspflicht **befreien** lassen. Ein entsprechendes Formular wird bereitgestellt. ⚠︎ *Befreiungsantrag über das Lohnbüro dokumentieren.*
6. Der/die Arbeitnehmer:in ist verpflichtet, **weitere Beschäftigungen** (insbesondere andere Minijobs) unaufgefordert anzuzeigen, da diese zusammengerechnet werden und den Minijob-Status gefährden können (§ 11).

## § 4 Arbeitszeit und flexible Stundenverteilung

1. Die Arbeitszeit richtet sich flexibel nach dem Einsatzbedarf und wird über die Einsatzplanung festgelegt. Die durchschnittliche monatliche Arbeitszeit orientiert sich an der einzuhaltenden Verdienstgrenze.
2. Rechnerisches Beispiel: Bei einem Stundenlohn von 13,90 € (Mindestlohn 2026) entspricht die 603-€-Grenze rund **43 Arbeitsstunden pro Monat**; bei höherem Stundenlohn entsprechend weniger. ⚠︎ *Monatliche Stundenobergrenze aus dem tatsächlichen Stundenlohn ableiten und laufend überwachen.*
3. Der/die Arbeitnehmer:in ist verpflichtet, die vereinbarte Verdienst- bzw. Stundengrenze einzuhalten und Mehrarbeit nur nach Abstimmung zu leisten.
4. Ein Mindeststundenvolumen wird nicht garantiert, soweit nicht gesondert vereinbart.

## § 5 Vergütung und Mindestlohn

1. Die Vergütung beträgt **[__,__] € brutto je geleisteter Arbeitsstunde**.
2. Die Vergütung darf den zum Zeitpunkt der Auszahlung geltenden **gesetzlichen Mindestlohn (2026: 13,90 €/Std.; 2027: 14,60 €/Std.)** nicht unterschreiten. *(Interne Kalkulationsannahme Minijob: 15 €/Std. — finaler Satz ist einzutragen.)*
3. Die monatliche Vergütung darf im Durchschnitt die Grenze von **603 €** nicht überschreiten (§ 3).
4. Die Abrechnung erfolgt monatlich auf Basis der erfassten und dokumentierten Arbeitszeit (§ 6); die Auszahlung erfolgt bis zum [__.] Werktag des Folgemonats auf: [IBAN].

## § 6 Arbeitszeiterfassung

1. Für geringfügig Beschäftigte besteht eine **besondere gesetzliche Pflicht zur Aufzeichnung** von Beginn, Ende und Dauer der täglichen Arbeitszeit (§ 17 MiLoG). Die Erfassung erfolgt **spätestens am Einsatztag** im bereitgestellten elektronischen Zeiterfassungssystem.
2. Die vollständige Arbeitszeiterfassung ist **Voraussetzung für die Vergütung** und die Leistungsabrechnung. Ohne erfassten und dokumentierten Einsatz erfolgt keine Abrechnung.
3. Vorsätzlich unrichtige Zeitangaben stellen eine schwerwiegende Pflichtverletzung dar und können arbeitsrechtliche Konsequenzen bis zur Kündigung nach sich ziehen.

## § 7 Probezeit

1. Die ersten **[sechs] Monate** gelten als Probezeit.
2. Während der Probezeit kann das Arbeitsverhältnis beidseitig mit einer Frist von **zwei Wochen** gekündigt werden.

## § 8 Qualifikation und Einsatzvoraussetzungen

1. Der/die Arbeitnehmer:in versichert, die für den Einsatz erforderliche **anerkannte Qualifikation** (einschlägige Ausbildung/Studium, Nachweis Betreuungskraft nach § 53c SGB XI / 160 Std. oder Basisqualifizierung 40 UE) bereits **mitzubringen** und vor Tätigkeitsbeginn nachzuweisen.
2. Vor dem ersten Einsatz sind **erweitertes Führungszeugnis** und Qualifikationsnachweise vorzulegen; die Registrierung muss **vor** dem ersten Kundeneinsatz abgeschlossen sein.
3. Der Einsatz beim Kunden erfolgt erst nach ausdrücklicher **Freigabe durch die verantwortliche Fachkraft**.

## § 9 Dokumentationspflicht

1. Der/die Arbeitnehmer:in dokumentiert **nach jedem Einsatz** vollständig im internen System: Datum, Start- und Endzeit, Einsatzort, betreute Person, erbrachte Leistungen, Besonderheiten, ggf. Stimmung/Verfassung sowie Abweichungen.
2. **Auffälligkeiten** sind unverzüglich an die verantwortliche Fachkraft zu melden.
3. Das interne System ist die **einzige zulässige Dokumentationsquelle**; private Aufzeichnungen oder private Messenger-Dienste (z. B. WhatsApp) für Kunden-/Gesundheitsdaten sind untersagt.
4. Es dürfen **keine medizinischen Diagnosen** gestellt oder dokumentiert werden.

## § 10 Verschwiegenheit und Datenschutz

1. Der/die Arbeitnehmer:in unterliegt der **Verschwiegenheitspflicht** über alle Kunden-, Gesundheits- und Geschäftsdaten sowie der Verpflichtung auf Vertraulichkeit nach der DSGVO.
2. Die Einzelheiten regelt die gesondert zu unterzeichnende **„Verschwiegenheits- und Datenschutzverpflichtung für Mitarbeitende"** als Anlage und wesentlicher Vertragsbestandteil.
3. Die Verpflichtungen bestehen **auch nach Beendigung** des Arbeitsverhältnisses fort.

## § 11 Nebentätigkeit / weitere Beschäftigungen

1. Weitere Beschäftigungen, insbesondere andere Minijobs, sind **vor Aufnahme schriftlich anzuzeigen**, da eine Zusammenrechnung den Status als geringfügige Beschäftigung entfallen lassen kann.
2. Der Arbeitgeber kann einer Nebentätigkeit widersprechen, wenn berechtigte betriebliche Interessen entgegenstehen (u. a. Wettbewerb, Beeinträchtigung der Vertragspflichten, Statusgefährdung).
3. Konkurrenztätigkeit bei unmittelbaren Wettbewerbern während des Arbeitsverhältnisses ist unzulässig. ⚠︎ *Reichweite mit Anwalt prüfen.*

## § 12 Urlaub, Arbeitsverhinderung, Krankheit

1. Auch geringfügig Beschäftigte haben Anspruch auf **bezahlten Erholungsurlaub** nach dem Bundesurlaubsgesetz; der Anspruch beträgt anteilig **[__] Werktage** pro Kalenderjahr. ⚠︎ *Anteilige Berechnung bei flexibler Arbeitszeit durch Lohnbüro.*
2. Eine Arbeitsverhinderung ist **unverzüglich** anzuzeigen; eine ärztliche Bescheinigung ist spätestens ab dem [dritten] Tag vorzulegen.
3. Es gelten die gesetzlichen Regelungen zur Entgeltfortzahlung im Krankheitsfall und an Feiertagen (anteilig).

## § 13 Kündigung

1. Nach Ablauf der Probezeit gelten die gesetzlichen Kündigungsfristen nach § 622 BGB.
2. Jede Kündigung bedarf der **Schriftform**; die elektronische Form ist ausgeschlossen.
3. Das Recht zur außerordentlichen Kündigung aus wichtigem Grund bleibt unberührt.

## § 14 Herausgabe / Rückgabe

Bei Beendigung des Arbeitsverhältnisses sind sämtliche überlassenen Gegenstände (u. a. Dienstkleidung, Zugangsdaten, Ausweise, Unterlagen) sowie alle Daten und Kopien unverzüglich herauszugeben bzw. zu löschen.

## § 15 Schlussbestimmungen

1. Änderungen und Ergänzungen bedürfen der Schriftform; dies gilt auch für die Aufhebung des Schriftformerfordernisses.
2. Sollte eine Bestimmung unwirksam sein, bleibt die Wirksamkeit der übrigen Bestimmungen unberührt. ⚠︎ *Salvatorische Klausel in AGB-Kontrolle prüfen.*
3. Es gilt das Recht der Bundesrepublik Deutschland.
4. Nebenabreden bestehen nicht bzw. sind gesondert schriftlich fixiert.
